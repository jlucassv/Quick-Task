<rect x="330" y="835" width="1030" height="65" rx="12" fill="#EAF0FF"/><text x="360" y="874" font-family="Arial" font-size="15" fill="#3157D5">Fluxo: Minhas tarefas → Detalhes → Marcar concluída.</text><text x="60" y="985" class="small">QUICK TASK · DETALHES DA TAREFA</text>
